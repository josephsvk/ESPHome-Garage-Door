substitutions:
  # =========================================================
  # ZÁKLAD
  # =========================================================
  node_name: !secret node_name
  friendly_name: !secret friendly_name

  wg_address: !secret wg_address
  board: !secret board
  framework: !secret framework

  gate_name: "Garážová brána"

  # =========================================================
  # GPIO PINY
  # =========================================================
  gpio_open: !secret gpio_open
  gpio_close: !secret gpio_close
  gpio_stop: !secret gpio_stop
  gpio_closed: !secret gpio_closed

  # =========================================================
  # ČASY
  # =========================================================

  # Dĺžka stlačenia reléového vstupu brány.
  relay_pulse: 700ms

  # Krátka bezpečnostná pauza medzi povelmi relé.
  relay_interlock_wait: 50ms

  # Debounce fyzického CLOSED senzora.
  sensor_debounce: 150ms

  # Nemáme horný koncový snímač.
  # Po tomto čase od OPEN predpokladáme,
  # že pohyb skončil a brána je otvorená.
  assume_open_after: 10s

  # Maximálny čas, počas ktorého budeme
  # po CLOSE zobrazovať CLOSING.
  #
  # Nastav o niečo viac ako reálny čas zatvorenia.
  close_timeout: 30s

  # =========================================================
  # LOGIKA
  # =========================================================
  relay_inverted: "false"
  sensor_inverted: "true"

# =========================================================
# ESPHOME
# =========================================================

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

  # =======================================================
  # BOOT - BEZPEČNÉ VYPNUTIE RELÉ
  # =======================================================

  on_boot:

  # Hardware komponenty sú už inicializované,
  # ale ešte nezačíname určovať stav brány.
  - priority: 700
    then:

    - logger.log:
        level: WARN
        format: "BOOT: bezpečnostné vypnutie všetkých relé"

    - script.stop: relay_open_pulse
    - script.stop: relay_close_pulse
    - script.stop: relay_stop_pulse

    - switch.turn_off: relay_open
    - switch.turn_off: relay_close
    - switch.turn_off: relay_stop

  # Po inicializácii prakticky všetkých komponentov
  # synchronizujeme stav podľa fyzického CLOSED senzora.
  - priority: -100
    then:

    - logger.log:
        level: WARN
        format: "BOOT: synchronizujem stav brány podľa CLOSED senzora"

    - if:
        condition:
          binary_sensor.is_on: gate_closed_sensor

        then:

        - globals.set:
            id: gate_logic_state
            value: '4'

        - lambda: |-
            id(open_session_active) = false;
            id(open_session_started_ms) = 0;

        - cover.template.publish:
            id: garage_gate
            state: CLOSED
            current_operation: IDLE

        - logger.log:
            level: WARN
            format: "BOOT: CLOSED senzor aktívny | brána = ZATVORENÁ"

        else:

        # Nevieme, ako dlho bola otvorená pred rebootom.
        # Od bootu však začneme merať ďalší otvorený čas.
        - globals.set:
            id: gate_logic_state
            value: '0'

        - lambda: |-
            id(open_session_active) = true;
            id(open_session_started_ms) = millis();

        - cover.template.publish:
            id: garage_gate
            state: OPEN
            current_operation: IDLE

        - logger.log:
            level: WARN
            format: "BOOT: CLOSED senzor neaktívny | brána = OTVORENÁ / NEZNÁMA"

# =========================================================
# ESP32 + OTA ROLLBACK
# =========================================================

esp32:
  board: ${board}

  framework:
    type: ${framework}

# =========================================================
# LOGGER
# =========================================================

logger:
  level: DEBUG

  logs:
    switch: DEBUG
    binary_sensor: DEBUG
    cover: DEBUG
    gpio: DEBUG
    wifi: INFO
    api: INFO
    wireguard: INFO

# =========================================================
# WIFI
# =========================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  use_address: ${wg_address}

  power_save_mode: none

  # Ak sa ESP nepripojí k Wi-Fi,
  # umožníme watchdog reboot.
  reboot_timeout: 2min

  ap:
    ssid: "${node_name}-fallback"
    password: !secret fallback_password

  on_connect:
  - logger.log:
      level: WARN
      format: "WIFI: pripojené"

  on_disconnect:
  - logger.log:
      level: WARN
      format: "WIFI: odpojené"

# =========================================================
# API
# =========================================================

api:
  encryption:
    key: !secret api_key

  reboot_timeout: 0s

  on_client_connected:
  - logger.log:
      level: WARN
      format: "API: klient pripojený"

  on_client_disconnected:
  - logger.log:
      level: WARN
      format: "API: klient odpojený"

# =========================================================
# OTA
# =========================================================

ota:
- platform: esphome
  password: !secret ota_password
  version: 2

# =========================================================
# SAFE MODE + OTA ROLLBACK
# =========================================================

safe_mode:
  boot_is_good_after: 5min

captive_portal:

# =========================================================
# ČAS
# =========================================================

time:
- platform: sntp
  id: sntp_time

# =========================================================
# WIREGUARD
# =========================================================

wireguard:
  id: wg_client

  address: ${wg_address}
  netmask: 255.255.255.0

  private_key: !secret wg_private_key

  peer_endpoint: !secret wg_endpoint
  peer_port: !secret wg_endpoint_port

  peer_public_key: !secret wg_peer_public_key

  peer_allowed_ips:
  - !secret wg_allowed_ips

  peer_persistent_keepalive: 25s

  reboot_timeout: 0s

# =========================================================
# VNÚTORNÁ LOGIKA BRÁNY
# =========================================================
#
# gate_logic_state:
#
# 0 = otvorená / neznáma
# 1 = otvára sa
# 2 = zatvára sa
# 4 = zatvorená potvrdená senzorom
# 5 = STOP / otvorená medzipoloha
# 6 = otvorená predpokladom
# 7 = CLOSE timeout - stále nezatvorená
#
# =========================================================

globals:

- id: gate_logic_state
  type: int
  restore_value: no
  initial_value: '0'

# =======================================================
# OTVORENÁ RELÁCIA
# =======================================================

- id: open_session_active
  type: bool
  restore_value: no
  initial_value: 'false'

# Používame millis(), nie sekundy.
# uint32_t rozdiel millis() funguje korektne
# aj cez wrap millis() približne po 49 dňoch.
- id: open_session_started_ms
  type: uint32_t
  restore_value: no
  initial_value: '0'

# =======================================================
# ŠTATISTIKY
# =======================================================

- id: gate_open_count_total
  type: uint32_t
  restore_value: yes
  initial_value: '0'

- id: gate_close_count_total
  type: uint32_t
  restore_value: yes
  initial_value: '0'

- id: gate_total_open_seconds
  type: uint32_t
  restore_value: yes
  initial_value: '0'

- id: gate_last_open_seconds
  type: uint32_t
  restore_value: yes
  initial_value: '0'

# =========================================================
# SCRIPTY
# =========================================================

script:

# =======================================================
# RELÉ - OPEN IMPULZ
# =======================================================
#
# Samostatný skript zabraňuje problému,
# keď starý 700 ms timer vypne nový impulz.
#
# =======================================================

- id: relay_open_pulse
  mode: restart

  then:

  - script.stop: relay_close_pulse
  - script.stop: relay_stop_pulse

  - switch.turn_off: relay_open
  - switch.turn_off: relay_close
  - switch.turn_off: relay_stop

  - delay: ${relay_interlock_wait}

  - logger.log:
      level: WARN
      format: "RELAY OPEN: ON | pin=${gpio_open} | pulse=${relay_pulse}"

  - switch.turn_on: relay_open

  - delay: ${relay_pulse}

  - switch.turn_off: relay_open

  - logger.log:
      level: WARN
      format: "RELAY OPEN: OFF | pin=${gpio_open}"

# =======================================================
# RELÉ - CLOSE IMPULZ
# =======================================================

- id: relay_close_pulse
  mode: restart

  then:

  - script.stop: relay_open_pulse
  - script.stop: relay_stop_pulse

  - switch.turn_off: relay_open
  - switch.turn_off: relay_close
  - switch.turn_off: relay_stop

  - delay: ${relay_interlock_wait}

  - logger.log:
      level: WARN
      format: "RELAY CLOSE: ON | pin=${gpio_close} | pulse=${relay_pulse}"

  - switch.turn_on: relay_close

  - delay: ${relay_pulse}

  - switch.turn_off: relay_close

  - logger.log:
      level: WARN
      format: "RELAY CLOSE: OFF | pin=${gpio_close}"

# =======================================================
# RELÉ - STOP IMPULZ
# =======================================================

- id: relay_stop_pulse
  mode: restart

  then:

  - script.stop: relay_open_pulse
  - script.stop: relay_close_pulse

  # Okamžite odstránime prípadný OPEN/CLOSE povel.
  - switch.turn_off: relay_open
  - switch.turn_off: relay_close
  - switch.turn_off: relay_stop

  - delay: ${relay_interlock_wait}

  - logger.log:
      level: WARN
      format: "RELAY STOP: ON | pin=${gpio_stop} | pulse=${relay_pulse}"

  - switch.turn_on: relay_stop

  - delay: ${relay_pulse}

  - switch.turn_off: relay_stop

  - logger.log:
      level: WARN
      format: "RELAY STOP: OFF | pin=${gpio_stop}"

# =======================================================
# ŠTATISTIKA - ZAČIATOK OTVORENEJ RELÁCIE
# =======================================================
#
# Volá sa pri fyzickom RELEASE CLOSED senzora.
#
# Nezávisí od OPEN príkazu.
#
# =======================================================

- id: gate_start_open_session
  mode: single

  then:

  - if:
      condition:
        lambda: 'return !id(open_session_active);'

      then:

      - lambda: |-
          id(open_session_active) = true;
          id(open_session_started_ms) = millis();
          id(gate_open_count_total) += 1;

      - component.update: gate_open_count_sensor
      - component.update: gate_current_open_minutes
      - component.update: gate_total_open_hours

      - logger.log:
          level: WARN
          format: "ŠTATISTIKA: CLOSED senzor sa uvoľnil | otvorená relácia začala | počet=%u"
          args:
          - 'static_cast<unsigned int>(id(gate_open_count_total))'

# =======================================================
# ŠTATISTIKA - KONIEC OTVORENEJ RELÁCIE
# =======================================================
#
# Volá sa výhradne po fyzickom potvrdení CLOSED.
#
# CLOSE príkaz túto reláciu NEUKONČUJE.
#
# =======================================================

- id: gate_stop_open_session
  mode: single

  then:

  - if:
      condition:
        lambda: 'return id(open_session_active);'

      then:

      - lambda: |-
          uint32_t elapsed_ms =
              millis() - id(open_session_started_ms);

          uint32_t elapsed_s =
              elapsed_ms / 1000UL;

          id(gate_last_open_seconds) = elapsed_s;
          id(gate_total_open_seconds) += elapsed_s;

          id(open_session_active) = false;
          id(open_session_started_ms) = 0;

      - component.update: gate_current_open_minutes
      - component.update: gate_last_open_minutes
      - component.update: gate_total_open_hours

      - logger.log:
          level: WARN
          format: "ŠTATISTIKA: CLOSED potvrdené | relácia skončila | posledné=%.1f min | celkovo=%.2f h"
          args:
          - 'id(gate_last_open_seconds) / 60.0f'
          - 'id(gate_total_open_seconds) / 3600.0f'

# =======================================================
# OPEN SEKVENCA
# =======================================================

- id: gate_open_sequence
  mode: restart

  then:

  # Rušíme opačný predpoklad pohybu.
  - script.stop: gate_close_sequence
  - script.stop: gate_manual_open_sequence

  - globals.set:
      id: gate_logic_state
      value: '1'

  - logger.log:
      level: WARN
      format: "LOGIKA: OPEN | otváranie spustené"

  - cover.template.publish:
      id: garage_gate
      state: OPEN
      current_operation: OPENING

  - script.execute: relay_open_pulse

  # Nemáme OPEN koncový snímač.
  - delay: ${assume_open_after}

  - if:
      condition:
        lambda: |-
          return
            id(gate_logic_state) == 1 &&
            !id(gate_closed_sensor).state;

      then:

      - globals.set:
          id: gate_logic_state
          value: '6'

      - logger.log:
          level: WARN
          format: "LOGIKA: OPEN timeout ${assume_open_after} | nastavujem OTVORENÉ PREDPOKLADOM"

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: IDLE

# =======================================================
# MANUÁLNE / EXTERNÉ OTVORENIE
# =======================================================
#
# CLOSED senzor sa uvoľnil bez aktívneho ESP OPEN.
#
# =======================================================

- id: gate_manual_open_sequence
  mode: restart

  then:

  - if:
      condition:
        lambda: |-
          return
            id(gate_logic_state) != 1 &&
            id(gate_logic_state) != 2;

      then:

      - globals.set:
          id: gate_logic_state
          value: '1'

      - logger.log:
          level: WARN
          format: "LOGIKA: CLOSED senzor sa uvoľnil mimo ESP pohybu | predpokladám manuálne/external OPEN"

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: OPENING

      - delay: ${assume_open_after}

      - if:
          condition:
            lambda: |-
              return
                id(gate_logic_state) == 1 &&
                !id(gate_closed_sensor).state;

          then:

          - globals.set:
              id: gate_logic_state
              value: '6'

          - logger.log:
              level: WARN
              format: "LOGIKA: manuálne otvorenie | po ${assume_open_after} nastavujem OTVORENÉ PREDPOKLADOM"

          - cover.template.publish:
              id: garage_gate
              state: OPEN
              current_operation: IDLE

# =======================================================
# CLOSE SEKVENCA
# =======================================================

- id: gate_close_sequence
  mode: restart

  then:

  # Ak fyzický senzor už tvrdí CLOSED,
  # neposielame zbytočne povel do pohonu.
  - if:
      condition:
        binary_sensor.is_on: gate_closed_sensor

      then:

      - globals.set:
          id: gate_logic_state
          value: '4'

      - cover.template.publish:
          id: garage_gate
          state: CLOSED
          current_operation: IDLE

      - logger.log:
          level: WARN
          format: "LOGIKA: CLOSE ignorovaný | brána je už fyzicky ZATVORENÁ"

      else:

      - script.stop: gate_open_sequence
      - script.stop: gate_manual_open_sequence

      # POZOR:
      # otvorenú reláciu tu NEUKONČUJEME.
      # Brána je stále otvorená až do CLOSED senzora.

      - lambda: |-
          id(gate_close_count_total) += 1;

      - component.update: gate_close_count_sensor

      - globals.set:
          id: gate_logic_state
          value: '2'

      - logger.log:
          level: WARN
          format: "LOGIKA: CLOSE | zatváranie spustené | čakám na fyzický CLOSED senzor"

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: CLOSING

      - script.execute: relay_close_pulse

      # =================================================
      # CLOSE WATCHDOG
      # =================================================

      - delay: ${close_timeout}

      - if:
          condition:
            lambda: |-
              return
                id(gate_logic_state) == 2 &&
                !id(gate_closed_sensor).state;

          then:

          - globals.set:
              id: gate_logic_state
              value: '7'

          - cover.template.publish:
              id: garage_gate
              state: OPEN
              current_operation: IDLE

          - logger.log:
              level: ERROR
              format: "LOGIKA: CLOSE TIMEOUT ${close_timeout} | CLOSED senzor nepotvrdil zatvorenie"

# =========================================================
# RELÉ
# =========================================================
#
# Softvérový interlock je druhá bezpečnostná vrstva.
#
# Primárna logika už relé vypína pred každým ďalším
# povelom, ale interlock zabráni súčasnému OPEN/CLOSE/STOP
# aj pri chybe vyššej logiky.
#
# =========================================================

switch:

# =======================================================
# OPEN RELÉ
# =======================================================

- platform: gpio
  id: relay_open

  internal: true

  restore_mode: ALWAYS_OFF

  pin:
    number: ${gpio_open}
    inverted: ${relay_inverted}

  interlock: &relay_interlock_group
    - relay_open
    - relay_close
    - relay_stop

  interlock_wait_time: ${relay_interlock_wait}

# =======================================================
# CLOSE RELÉ
# =======================================================

- platform: gpio
  id: relay_close

  internal: true

  restore_mode: ALWAYS_OFF

  pin:
    number: ${gpio_close}
    inverted: ${relay_inverted}

  interlock: *relay_interlock_group

  interlock_wait_time: ${relay_interlock_wait}

# =======================================================
# STOP RELÉ
# =======================================================

- platform: gpio
  id: relay_stop

  internal: true

  restore_mode: ALWAYS_OFF

  pin:
    number: ${gpio_stop}
    inverted: ${relay_inverted}

  interlock: *relay_interlock_group

  interlock_wait_time: ${relay_interlock_wait}

# =========================================================
# SENZOR ZATVORENEJ BRÁNY
# =========================================================

binary_sensor:

- platform: gpio

  id: gate_closed_sensor

  name: "${gate_name} zatvorená"

  pin:
    number: ${gpio_closed}

    mode:
      input: true
      pullup: true

    inverted: ${sensor_inverted}

  filters:
  - delayed_on_off: ${sensor_debounce}

  # =====================================================
  # FYZICKY ZATVORENÁ
  # =====================================================

  on_press:

  # CLOSED senzor má absolútnu prioritu.
  - script.stop: gate_close_sequence
  - script.stop: gate_open_sequence
  - script.stop: gate_manual_open_sequence

  # Ukončíme všetky prípadné relé impulzy.
  - script.stop: relay_open_pulse
  - script.stop: relay_close_pulse
  - script.stop: relay_stop_pulse

  - switch.turn_off: relay_open
  - switch.turn_off: relay_close
  - switch.turn_off: relay_stop

  # Otvorený čas končí AŽ TERAZ.
  - script.execute: gate_stop_open_session

  - globals.set:
      id: gate_logic_state
      value: '4'

  - logger.log:
      level: WARN
      format: "SENZOR: ZATVORENÁ POTVRDENÁ | pin=${gpio_closed}"

  - cover.template.publish:
      id: garage_gate
      state: CLOSED
      current_operation: IDLE

  # =====================================================
  # BRÁNA OPUSTILA CLOSED POLOHU
  # =====================================================

  on_release:

  - logger.log:
      level: WARN
      format: "SENZOR: CLOSED sa uvoľnil | brána už nie je zatvorená"

  # Toto je jediný správny fyzický začiatok
  # merania otvoreného času.
  - script.execute: gate_start_open_session

  # Ak sme uvoľnenie CLOSED senzora neočakávali
  # ako súčasť ESP OPEN/CLOSE, ide o manuálny
  # alebo externý pohyb.
  - if:
      condition:
        lambda: |-
          return
            id(gate_logic_state) != 1 &&
            id(gate_logic_state) != 2;

      then:

      - script.execute: gate_manual_open_sequence

# =======================================================
# LOGICKÝ SENZOR
# =======================================================
#
# ON = fyzický CLOSED senzor nie je aktívny.
#
# Nezávisí od interného predpokladu pohybu.
#
# =======================================================

- platform: template

  id: gate_open_logical_binary

  name: "${gate_name} otvorená logicky"

  device_class: garage_door

  lambda: |-
    return !id(gate_closed_sensor).state;

# =======================================================
# WIREGUARD STATUS
# =======================================================

- platform: wireguard

  status:
    name: "${node_name} WireGuard Status"
    entity_category: diagnostic

  enabled:
    id: wg_enabled_internal
    internal: true

# =========================================================
# SENZORY
# =========================================================

sensor:

# =======================================================
# AKTUÁLNY ČAS OTVORENIA
# =======================================================

- platform: template

  id: gate_current_open_minutes

  name: "${gate_name} aktuálne otvorená"

  unit_of_measurement: "min"

  device_class: duration

  state_class: measurement

  accuracy_decimals: 1

  update_interval: 10s

  lambda: |-
    if (!id(open_session_active)) {
      return 0.0f;
    }

    uint32_t elapsed_ms =
        millis() - id(open_session_started_ms);

    return elapsed_ms / 60000.0f;

# =======================================================
# POSLEDNÉ OTVORENIE
# =======================================================

- platform: template

  id: gate_last_open_minutes

  name: "${gate_name} posledné otvorenie"

  unit_of_measurement: "min"

  device_class: duration

  state_class: measurement

  accuracy_decimals: 1

  update_interval: 60s

  lambda: |-
    return id(gate_last_open_seconds) / 60.0f;

# =======================================================
# CELKOVÝ ČAS OTVORENIA
# =======================================================

- platform: template

  id: gate_total_open_hours

  name: "${gate_name} celkovo otvorená"

  unit_of_measurement: "h"

  device_class: duration

  state_class: total_increasing

  accuracy_decimals: 2

  update_interval: 30s

  lambda: |-
    uint32_t total_s =
        id(gate_total_open_seconds);

    if (id(open_session_active)) {

      uint32_t elapsed_ms =
          millis() - id(open_session_started_ms);

      total_s += elapsed_ms / 1000UL;
    }

    return total_s / 3600.0f;

# =======================================================
# POČET OTVORENÍ
# =======================================================

- platform: template

  id: gate_open_count_sensor

  name: "${gate_name} počet otvorení"

  unit_of_measurement: "x"

  state_class: total_increasing

  accuracy_decimals: 0

  icon: "mdi:garage-open"

  update_interval: 60s

  lambda: |-
    return id(gate_open_count_total);

# =======================================================
# POČET CLOSE PRÍKAZOV
# =======================================================

- platform: template

  id: gate_close_count_sensor

  name: "${gate_name} počet CLOSE príkazov"

  unit_of_measurement: "x"

  state_class: total_increasing

  accuracy_decimals: 0

  icon: "mdi:garage"

  update_interval: 60s

  lambda: |-
    return id(gate_close_count_total);

# =========================================================
# DIAGNOSTIKA LOGIKY
# =========================================================

text_sensor:

- platform: template

  id: gate_logic_text

  name: "${gate_name} logika"

  entity_category: diagnostic

  # Pôvodne 1s spôsobovalo zbytočný spam v logu.
  update_interval: 5s

  lambda: |-
    
    if (id(gate_closed_sensor).state) {
      return {"zatvorená potvrdená senzorom"};
    }

    switch (id(gate_logic_state)) {

      case 0:
        return {"otvorená / neznáma"};

      case 1:
        return {"otvára sa"};

      case 2:
        return {"zatvára sa - čakám na senzor"};

      case 4:
        return {"zatvorená potvrdená senzorom"};

      case 5:
        return {"stop"};

      case 6:
        return {"otvorená predpokladom"};

      case 7:
        return {"chyba - CLOSE timeout"};

      default:
        return {"neznámy stav"};
    }

# =========================================================
# HOME ASSISTANT COVER
# =========================================================

cover:

- platform: template

  id: garage_gate

  name: "${gate_name}"

  device_class: garage

  # Nemáme horný koncový snímač.
  assumed_state: true

  # CLOSED senzor je jediný fyzický zdroj pravdy.
  lambda: |-
    
    if (id(gate_closed_sensor).state) {
      return COVER_CLOSED;
    }

    return COVER_OPEN;

  # =====================================================
  # OPEN
  # =====================================================

  open_action:

  - logger.log:
      level: WARN
      format: "COVER: OPEN action prijatá"

  - script.execute: gate_open_sequence

  # =====================================================
  # CLOSE
  # =====================================================

  close_action:

  - logger.log:
      level: WARN
      format: "COVER: CLOSE action prijatá"

  - script.execute: gate_close_sequence

  # =====================================================
  # STOP
  # =====================================================

  stop_action:

  - logger.log:
      level: WARN
      format: "COVER: STOP action prijatá"

  # Rušíme všetky predpoklady pohybu.
  - script.stop: gate_open_sequence
  - script.stop: gate_close_sequence
  - script.stop: gate_manual_open_sequence

  # STOP pulse skript zároveň okamžite vypne
  # prípadné OPEN/CLOSE relé.
  - script.execute: relay_stop_pulse

  - if:
      condition:
        binary_sensor.is_on: gate_closed_sensor

      then:

      - globals.set:
          id: gate_logic_state
          value: '4'

      - cover.template.publish:
          id: garage_gate
          state: CLOSED
          current_operation: IDLE

      else:

      # Otvorená relácia pokračuje.
      # STOP neznamená zatvorenú bránu.
      - globals.set:
          id: gate_logic_state
          value: '5'

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: IDLE

# =========================================================
# TLAČIDLÁ
# =========================================================

button:

# =======================================================
# RESTART
# =======================================================

- platform: restart

  name: "${node_name} Restart"

  entity_category: diagnostic

# =======================================================
# RESET ŠTATISTÍK
# =======================================================

- platform: template

  name: "${gate_name} reset štatistík"

  entity_category: diagnostic

  icon: "mdi:counter"

  on_press:

  - lambda: |-
      
      id(gate_open_count_total) = 0;
      id(gate_close_count_total) = 0;
      id(gate_total_open_seconds) = 0;
      id(gate_last_open_seconds) = 0;

      # Ak je brána práve otvorená,
      # po resete začíname merať novú reláciu od nuly.
      if (id(open_session_active)) {
        id(open_session_started_ms) = millis();
      }

  - component.update: gate_open_count_sensor
  - component.update: gate_close_count_sensor
  - component.update: gate_current_open_minutes
  - component.update: gate_last_open_minutes
  - component.update: gate_total_open_hours

  - logger.log:
      level: WARN
      format: "ŠTATISTIKA: reset počítadiel"
