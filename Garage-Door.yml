substitutions:
  # =========================================================
  # ZÁKLAD
  # =========================================================
  node_name: duko-esp32-s3-0001
  friendly_name: dusan-garage-v1

  wg_address: !secret garage01_wg_address
  board: esp32-s3-devkitc-1

  gate_name: "Garážová brána"

  # =========================================================
  # GPIO PINY
  # =========================================================
  gpio_open: GPIO4
  gpio_close: GPIO5
  gpio_stop: GPIO6
  gpio_closed: GPIO7
  gpio_dht22: GPIO15

  # =========================================================
  # ČASY
  # =========================================================
  relay_pulse: 700ms
  sensor_debounce: 150ms

  # Nemáme senzor úplne otvorenej polohy.
  assume_open_after: 10s

  # =========================================================
  # LOGIKA
  # =========================================================
  relay_inverted: "false"
  sensor_inverted: "true"

# =========================================================
# ESPHOME
# =========================================================

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: 800
    then:
    - logger.log:
        level: WARN
        format: "BOOT: vypínam všetky relé"

    - switch.turn_off: relay_open
    - switch.turn_off: relay_close
    - switch.turn_off: relay_stop

    - delay: 500ms

    - logger.log:
        level: WARN
        format: "BOOT: relé vypnuté | OPEN=${gpio_open} CLOSE=${gpio_close} STOP=${gpio_stop} SENSOR=${gpio_closed} inverted=${relay_inverted}"

    - delay: 2s

    - if:
        condition:
          binary_sensor.is_on: gate_closed_sensor

        then:
        - globals.set:
            id: gate_logic_state
            value: '4'

        - lambda: |-
            id(open_session_active) = false;
            id(open_session_started_s) = 0;

        - cover.template.publish:
            id: garage_gate
            state: CLOSED
            current_operation: IDLE

        - logger.log:
            level: WARN
            format: "BOOT: senzor hlási zatvorené | stav = zatvorená potvrdená"

        else:
        - globals.set:
            id: gate_logic_state
            value: '0'

        - lambda: |-
            id(open_session_active) = true;
            id(open_session_started_s) = millis() / 1000;

        - cover.template.publish:
            id: garage_gate
            state: OPEN
            current_operation: IDLE

        - logger.log:
            level: WARN
            format: "BOOT: senzor nehlási zatvorené | stav = otvorená / neznáma"

# =========================================================
# ESP32 + OTA ROLLBACK
# =========================================================
#
# Nový firmware sa nepovažuje okamžite za dobrý.
#
# Ak sa Wi-Fi nepripojí:
#   po 2 minútach Wi-Fi komponent vyvolá reboot.
#
# Pretože:
#   boot_is_good_on_shutdown: false
#
# normálny reboot nepotvrdí nový firmware.
#
# ESP32 bootloader tak môže vykonať OTA rollback na
# predchádzajúcu funkčnú verziu.
#
# =========================================================

esp32:
  board: ${board}

  framework:
    type: esp-idf

# =========================================================
# LOGGER
# =========================================================

logger:
  level: DEBUG

  logs:
    switch: DEBUG
    binary_sensor: DEBUG
    cover: DEBUG
    gpio: DEBUG
    dht: DEBUG
    wifi: INFO
    api: INFO
    wireguard: INFO

# =========================================================
# WIFI
# =========================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  use_address: ${wg_address}

  power_save_mode: none

  # =======================================================
  # OTA ROLLBACK WATCHDOG
  # =======================================================
  #
  # Ak sa ESP počas 2 minút nepripojí k Wi-Fi,
  # automaticky sa reštartuje.
  #
  # Nový firmware ešte nebude označený ako GOOD,
  # preto môže bootloader vykonať rollback.
  #
  # =======================================================

  reboot_timeout: 2min

  ap:
    ssid: "${node_name}-fallback"
    password: !secret fallback_password

  on_connect:
  - logger.log:
      level: WARN
      format: "WIFI: pripojené"

  on_disconnect:
  - logger.log:
      level: WARN
      format: "WIFI: odpojené"

# =========================================================
# API
# =========================================================

api:
  encryption:
    key: !secret garage01_api_key

  reboot_timeout: 0s

  on_client_connected:
  - logger.log:
      level: WARN
      format: "API: klient pripojený"

  on_client_disconnected:
  - logger.log:
      level: WARN
      format: "API: klient odpojený"

# =========================================================
# OTA
# =========================================================

ota:
- platform: esphome
  password: !secret garage01_ota_password
  version: 2

# =========================================================
# SAFE MODE + POTVRDENIE OTA FIRMWARE
# =========================================================
#
# Firmware sa označí ako úspešný až po 5 minútach
# normálneho behu.
#
# =========================================================

safe_mode:
  boot_is_good_after: 5min

captive_portal:

# =========================================================
# ČAS
# =========================================================

time:
- platform: sntp
  id: sntp_time

# =========================================================
# WIREGUARD
# =========================================================

wireguard:
  id: wg_client

  address: ${wg_address}
  netmask: 255.255.255.0

  private_key: !secret garage01_wg_private_key

  peer_endpoint: !secret garage01_wg_endpoint
  peer_port: !secret garage01_wg_port

  peer_public_key: !secret garage01_wg_public_key

  peer_allowed_ips:
  - 10.84.0.0/24

  peer_persistent_keepalive: 25s

  reboot_timeout: 0s

# =========================================================
# VNÚTORNÁ LOGIKA BRÁNY
# =========================================================

globals:

- id: gate_logic_state
  type: int
  restore_value: no
  initial_value: '0'

- id: open_session_active
  type: bool
  restore_value: no
  initial_value: 'false'

- id: open_session_started_s
  type: uint32_t
  restore_value: no
  initial_value: '0'

- id: gate_open_count_total
  type: uint32_t
  restore_value: yes
  initial_value: '0'

- id: gate_close_count_total
  type: uint32_t
  restore_value: yes
  initial_value: '0'

- id: gate_total_open_seconds
  type: uint32_t
  restore_value: yes
  initial_value: '0'

- id: gate_last_open_seconds
  type: uint32_t
  restore_value: yes
  initial_value: '0'

# =========================================================
# SCRIPTY
# =========================================================

script:

# =========================================================
# ŠTATISTIKA - ZAČIATOK OTVORENEJ RELÁCIE
# =========================================================

- id: gate_start_open_session

  mode: restart

  then:

  - if:
      condition:
        lambda: 'return !id(open_session_active);'

      then:

      - lambda: |-
          id(open_session_active) = true;
          id(open_session_started_s) = millis() / 1000;
          id(gate_open_count_total) += 1;

      - component.update: gate_open_count_sensor
      - component.update: gate_current_open_minutes
      - component.update: gate_total_open_hours

      - logger.log:
          level: WARN
          format: "ŠTATISTIKA: otvorená relácia začala | počet otvorení=%u"
          args:
          - 'static_cast<unsigned int>(id(gate_open_count_total))'

# =========================================================
# ŠTATISTIKA - KONIEC OTVORENEJ RELÁCIE
# =========================================================

- id: gate_stop_open_session

  mode: restart

  then:

  - if:
      condition:
        lambda: 'return id(open_session_active);'

      then:

      - lambda: |-
          uint32_t now_s = millis() / 1000;
          uint32_t elapsed_s = 0;

          if (now_s >= id(open_session_started_s)) {
            elapsed_s = now_s - id(open_session_started_s);
          }

          id(gate_last_open_seconds) = elapsed_s;
          id(gate_total_open_seconds) += elapsed_s;

          id(open_session_active) = false;
          id(open_session_started_s) = 0;

      - component.update: gate_current_open_minutes
      - component.update: gate_last_open_minutes
      - component.update: gate_total_open_hours

      - logger.log:
          level: WARN
          format: "ŠTATISTIKA: otvorená relácia skončila | posledné=%.1f min | celkovo=%.2f h"
          args:
          - 'id(gate_last_open_seconds) / 60.0f'
          - 'id(gate_total_open_seconds) / 3600.0f'

# =========================================================
# OPEN SEKVENCA
# =========================================================

- id: gate_open_sequence

  mode: restart

  then:

  - script.stop: gate_close_sequence
  - script.stop: gate_manual_open_sequence

  - globals.set:
      id: gate_logic_state
      value: '1'

  - logger.log:
      level: WARN
      format: "LOGIKA: otváranie spustené | po ${assume_open_after} nastavím otvorené"

  - cover.template.publish:
      id: garage_gate
      state: OPEN
      current_operation: OPENING

  - switch.turn_on: relay_open

  - delay: ${assume_open_after}

  - if:
      condition:
        lambda: 'return id(gate_logic_state) == 1;'

      then:

      - globals.set:
          id: gate_logic_state
          value: '6'

      - logger.log:
          level: WARN
          format: "LOGIKA: ${assume_open_after} od OPEN | nastavujem OTVORENÉ PREDPOKLADOM"

      - script.execute: gate_start_open_session

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: IDLE

# =========================================================
# MANUÁLNE OTVORENIE
# =========================================================

- id: gate_manual_open_sequence

  mode: restart

  then:

  - if:
      condition:
        lambda: 'return id(gate_logic_state) != 1 && id(gate_logic_state) != 2;'

      then:

      - globals.set:
          id: gate_logic_state
          value: '1'

      - logger.log:
          level: WARN
          format: "LOGIKA: senzor sa uvoľnil mimo ESP OPEN | predpokladám manuálne otváranie"

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: OPENING

      - delay: ${assume_open_after}

      - if:
          condition:
            lambda: 'return id(gate_logic_state) == 1;'

          then:

          - globals.set:
              id: gate_logic_state
              value: '6'

          - logger.log:
              level: WARN
              format: "LOGIKA: ${assume_open_after} od uvoľnenia senzora | nastavujem OTVORENÉ PREDPOKLADOM"

          - script.execute: gate_start_open_session

          - cover.template.publish:
              id: garage_gate
              state: OPEN
              current_operation: IDLE

# =========================================================
# CLOSE SEKVENCA
# =========================================================

- id: gate_close_sequence

  mode: restart

  then:

  - script.stop: gate_open_sequence
  - script.stop: gate_manual_open_sequence

  - script.execute: gate_stop_open_session

  - lambda: |-
      id(gate_close_count_total) += 1;

  - component.update: gate_close_count_sensor

  - globals.set:
      id: gate_logic_state
      value: '2'

  - logger.log:
      level: WARN
      format: "LOGIKA: zatváranie spustené | čakám na potvrdenie fyzickým senzorom"

  - cover.template.publish:
      id: garage_gate
      state: OPEN
      current_operation: CLOSING

  - switch.turn_on: relay_close

# =========================================================
# RELÉ
# =========================================================

switch:

# =========================================================
# OPEN RELÉ
# =========================================================

- platform: gpio

  id: relay_open

  internal: true

  restore_mode: ALWAYS_OFF

  pin:
    number: ${gpio_open}
    inverted: ${relay_inverted}

  on_turn_on:

  - logger.log:
      level: WARN
      format: "RELAY OPEN: ON | pin=${gpio_open} | inverted=${relay_inverted} | pulse=${relay_pulse}"

  - delay: ${relay_pulse}

  - switch.turn_off: relay_open

  on_turn_off:

  - logger.log:
      level: WARN
      format: "RELAY OPEN: OFF | pin=${gpio_open}"

# =========================================================
# CLOSE RELÉ
# =========================================================

- platform: gpio

  id: relay_close

  internal: true

  restore_mode: ALWAYS_OFF

  pin:
    number: ${gpio_close}
    inverted: ${relay_inverted}

  on_turn_on:

  - logger.log:
      level: WARN
      format: "RELAY CLOSE: ON | pin=${gpio_close} | inverted=${relay_inverted} | pulse=${relay_pulse}"

  - delay: ${relay_pulse}

  - switch.turn_off: relay_close

  on_turn_off:

  - logger.log:
      level: WARN
      format: "RELAY CLOSE: OFF | pin=${gpio_close}"

# =========================================================
# STOP RELÉ
# =========================================================

- platform: gpio

  id: relay_stop

  internal: true

  restore_mode: ALWAYS_OFF

  pin:
    number: ${gpio_stop}
    inverted: ${relay_inverted}

  on_turn_on:

  - logger.log:
      level: WARN
      format: "RELAY STOP: ON | pin=${gpio_stop} | inverted=${relay_inverted} | pulse=${relay_pulse}"

  - delay: ${relay_pulse}

  - switch.turn_off: relay_stop

  on_turn_off:

  - logger.log:
      level: WARN
      format: "RELAY STOP: OFF | pin=${gpio_stop}"

# =========================================================
# SENZOR ZATVORENEJ BRÁNY
# =========================================================

binary_sensor:

- platform: gpio

  id: gate_closed_sensor

  name: "${gate_name} zatvorená"

  pin:
    number: ${gpio_closed}
    mode: INPUT_PULLUP
    inverted: ${sensor_inverted}

  filters:
  - delayed_on_off: ${sensor_debounce}

  on_press:

  - script.stop: gate_close_sequence
  - script.stop: gate_open_sequence
  - script.stop: gate_manual_open_sequence

  - script.execute: gate_stop_open_session

  - globals.set:
      id: gate_logic_state
      value: '4'

  - logger.log:
      level: WARN
      format: "SENZOR: ZATVORENÁ POTVRDENÁ | pin=${gpio_closed} | inverted=${sensor_inverted}"

  - cover.template.publish:
      id: garage_gate
      state: CLOSED
      current_operation: IDLE

  on_release:

  - logger.log:
      level: WARN
      format: "SENZOR: BRÁNA UŽ NIE JE ZATVORENÁ | pin=${gpio_closed} | inverted=${sensor_inverted}"

  - if:
      condition:
        lambda: 'return id(gate_logic_state) != 1 && id(gate_logic_state) != 2;'

      then:

      - script.execute: gate_manual_open_sequence

# =========================================================
# LOGICKÝ SENZOR OTVORENEJ BRÁNY
# =========================================================

- platform: template

  id: gate_open_logical_binary

  name: "${gate_name} otvorená logicky"

  device_class: garage_door

  lambda: |-
    if (id(gate_closed_sensor).state) {
      return false;
    }

    if (id(gate_logic_state) == 0 || id(gate_logic_state) == 6) {
      return true;
    }

    return false;

# =========================================================
# WIREGUARD STATUS
# =========================================================

- platform: wireguard

  status:
    name: "${node_name} WireGuard Status"
    entity_category: diagnostic

  enabled:
    id: wg_enabled_internal
    internal: true

# =========================================================
# SENZORY
# =========================================================

sensor:

# =========================================================
# DHT22
# =========================================================

- platform: dht

  pin: ${gpio_dht22}

  model: DHT22

  temperature:
    id: dht22_temperature
    name: "${friendly_name} DHT22 teplota"
    accuracy_decimals: 1
    state_class: measurement

  humidity:
    id: dht22_humidity
    name: "${friendly_name} DHT22 vlhkosť"
    accuracy_decimals: 1
    state_class: measurement

  update_interval: 60s

# =========================================================
# AKTUÁLNY ČAS OTVORENIA
# =========================================================

- platform: template

  id: gate_current_open_minutes

  name: "${gate_name} aktuálne otvorená"

  unit_of_measurement: "min"

  device_class: duration

  state_class: measurement

  accuracy_decimals: 1

  update_interval: 10s

  lambda: |-
    if (!id(open_session_active)) {
      return 0.0f;
    }

    uint32_t now_s = millis() / 1000;

    if (now_s < id(open_session_started_s)) {
      return 0.0f;
    }

    return (now_s - id(open_session_started_s)) / 60.0f;

# =========================================================
# POSLEDNÉ OTVORENIE
# =========================================================

- platform: template

  id: gate_last_open_minutes

  name: "${gate_name} posledné otvorenie"

  unit_of_measurement: "min"

  device_class: duration

  state_class: measurement

  accuracy_decimals: 1

  update_interval: 60s

  lambda: |-
    return id(gate_last_open_seconds) / 60.0f;

# =========================================================
# CELKOVÝ ČAS OTVORENIA
# =========================================================

- platform: template

  id: gate_total_open_hours

  name: "${gate_name} celkovo otvorená"

  unit_of_measurement: "h"

  device_class: duration

  state_class: total_increasing

  accuracy_decimals: 2

  update_interval: 30s

  lambda: |-
    uint32_t total_s = id(gate_total_open_seconds);

    if (id(open_session_active)) {
      uint32_t now_s = millis() / 1000;

      if (now_s >= id(open_session_started_s)) {
        total_s += now_s - id(open_session_started_s);
      }
    }

    return total_s / 3600.0f;

# =========================================================
# POČET OTVORENÍ
# =========================================================

- platform: template

  id: gate_open_count_sensor

  name: "${gate_name} počet otvorení"

  unit_of_measurement: "x"

  state_class: total_increasing

  accuracy_decimals: 0

  icon: "mdi:garage-open"

  update_interval: 60s

  lambda: |-
    return id(gate_open_count_total);

# =========================================================
# POČET CLOSE PRÍKAZOV
# =========================================================

- platform: template

  id: gate_close_count_sensor

  name: "${gate_name} počet CLOSE príkazov"

  unit_of_measurement: "x"

  state_class: total_increasing

  accuracy_decimals: 0

  icon: "mdi:garage"

  update_interval: 60s

  lambda: |-
    return id(gate_close_count_total);

# =========================================================
# DIAGNOSTIKA LOGIKY
# =========================================================

text_sensor:

- platform: template

  id: gate_logic_text

  name: "${gate_name} logika"

  entity_category: diagnostic

  update_interval: 1s

  lambda: |-
    if (id(gate_closed_sensor).state) {
      return {"zatvorená potvrdená senzorom"};
    }

    switch (id(gate_logic_state)) {

      case 0:
        return {"otvorená / neznáma"};

      case 1:
        return {"otvára sa"};

      case 2:
        return {"zatvára sa - čakám na senzor"};

      case 3:
        return {"neplatný starý stav - čaká sa na fyzický senzor"};

      case 4:
        return {"zatvorená potvrdená senzorom"};

      case 5:
        return {"stop"};

      case 6:
        return {"otvorená predpokladom"};

      default:
        return {"neznámy stav"};
    }

# =========================================================
# HOME ASSISTANT COVER
# =========================================================

cover:

- platform: template

  id: garage_gate

  name: "${gate_name}"

  device_class: garage

  assumed_state: true

  lambda: |-
    // Fyzický senzor má najvyššiu prioritu.
    if (id(gate_closed_sensor).state) {
      return COVER_CLOSED;
    }

    // Stav 4 znamená fyzicky potvrdené CLOSED.
    if (id(gate_logic_state) == 4) {
      return COVER_CLOSED;
    }

    // Všetko ostatné znamená, že brána nie je potvrdene zatvorená.
    return COVER_OPEN;

  # =======================================================
  # OPEN
  # =======================================================

  open_action:

  - logger.log:
      level: WARN
      format: "COVER: OPEN action prijatá"

  - script.execute: gate_open_sequence
  # =======================================================
  # CLOSE
  # =======================================================

  close_action:

  - logger.log:
      level: WARN
      format: "COVER: CLOSE action prijatá"

  - script.execute: gate_close_sequence
  # =======================================================
  # STOP
  # =======================================================

  stop_action:

  - logger.log:
      level: WARN
      format: "COVER: STOP action prijatá"

  - script.stop: gate_open_sequence
  - script.stop: gate_close_sequence
  - script.stop: gate_manual_open_sequence

  - globals.set:
      id: gate_logic_state
      value: '5'

  - switch.turn_on: relay_stop

  - if:
      condition:
        binary_sensor.is_on: gate_closed_sensor

      then:

      - cover.template.publish:
          id: garage_gate
          state: CLOSED
          current_operation: IDLE

      else:

      - cover.template.publish:
          id: garage_gate
          state: OPEN
          current_operation: IDLE

# =========================================================
# TLAČIDLÁ
# =========================================================

button:

# =========================================================
# RESTART
# =========================================================

- platform: restart

  name: "${node_name} Restart"

  entity_category: diagnostic

# =========================================================
# RESET ŠTATISTÍK
# =========================================================

- platform: template

  name: "${gate_name} reset štatistík"

  entity_category: diagnostic

  icon: "mdi:counter"

  on_press:

  - lambda: |-
      id(gate_open_count_total) = 0;
      id(gate_close_count_total) = 0;
      id(gate_total_open_seconds) = 0;
      id(gate_last_open_seconds) = 0;

      if (id(open_session_active)) {
        id(open_session_started_s) = millis() / 1000;
      }

  - component.update: gate_open_count_sensor
  - component.update: gate_close_count_sensor
  - component.update: gate_current_open_minutes
  - component.update: gate_last_open_minutes
  - component.update: gate_total_open_hours

  - logger.log:
      level: WARN
      format: "ŠTATISTIKA: reset počítadiel"
